const stages=[{"title": "Enquête 1 : du profil public au harponnage", "lead": ["Leçons utilisées : renseignements publics (leçon 1), harponnage (leçon 2), lecture d’un domaine (leçon 3)."], "tip": "Les détails personnels rendent un message crédible, pas authentique.", "doc": "Dossier d’enquête", "sample": ["Le profil public de Karim montre son école et son équipe de natation.", "Il reçoit : « Salut Karim, c’est le coach Martin. Les résultats de la compétition sont ici : natation-resultats.example/karim. Connecte-toi avec ton compte scolaire. »", "Le vrai coach écrit toujours depuis une adresse @ecole-exemple.ca."], "consigne": "Quel raisonnement est le plus complet ?", "opts": ["C’est du harponnage : les détails viennent sûrement de son profil, et le domaine n’est pas celui de l’école", "C’est un hameçonnage de masse envoyé à tous les nageurs du pays", "Le message connaît son nom et son coach, il est donc fiable", "Il est suspect seulement parce qu’il demande une connexion"], "correct": 0, "why": "Le fraudeur a utilisé le profil public pour personnaliser son message, et le lien mène à « natation-resultats.example ». Les deux indices se renforcent."}, {"title": "Enquête 2 : le code et l’appel", "lead": ["Leçons utilisées : AMF (leçon 4), hameçonnage vocal (leçon 2), réagir (leçon 5)."], "tip": "Un code de vérification que tu n’as pas demandé veut dire que quelqu’un a ton mot de passe.", "doc": "Dossier d’enquête", "sample": ["Ton téléphone reçoit un code de connexion que tu n’as pas demandé.", "Une minute plus tard, quelqu’un appelle : « Soutien informatique de l’école. On bloque une attaque sur ton compte, lis-moi le code reçu. »"], "consigne": "Que se passe-t-il vraiment, et que fais-tu ?", "opts": ["Le fraudeur a ton mot de passe et il lui manque le code : tu raccroches, tu changes ton mot de passe et tu signales", "C’est une erreur du système : tu ignores le code et l’appel", "Le soutien t’aide : tu lis le code", "Tu donnes seulement la moitié du code pour tester l’appelant"], "correct": 0, "why": "C’est le fraudeur qui a déclenché le code avec ton mot de passe. Ignorer ne suffit pas : ton mot de passe est connu, il faut le changer et signaler."}, {"title": "Enquête 3 : le code QR de la cafétéria", "lead": ["Leçons utilisées : codes QR et leviers (leçon 2), lecture d’un domaine (leçon 3), réagir (leçon 5)."], "tip": "Ton courriel seul n’ouvre pas ton compte ; ton mot de passe, oui. Arrête-toi au premier doute.", "doc": "Dossier d’enquête", "sample": ["Un code QR collé sur la porte de la cafétéria : « Menu de la semaine + concours : gagne un repas ! »", "Tu l’as scanné. La page « cafeteria-concours.example » demande ton courriel scolaire et ton mot de passe.", "Tu as entré ton courriel, mais pas encore ton mot de passe."], "consigne": "Que fais-tu maintenant ?", "opts": ["Tu fermes la page sans entrer le mot de passe et tu signales l’affiche pour qu’on l’enlève", "Tu termines, puisque le concours est affiché à l’école", "Tu partages le code avec tes amis pour qu’ils participent aussi", "Tu entres un faux mot de passe pour tester la page"], "correct": 0, "why": "Appât du gain, code QR et domaine inconnu : trois indices. Tu t’arrêtes avant de donner ton mot de passe et tu signales pour protéger les autres élèves."}, {"title": "Enquête 4 : une vraie alerte ?", "lead": ["Leçons utilisées : vrai ou faux (leçon 3), vérifier par un canal indépendant (leçon 5), protéger ses comptes (leçon 4)."], "tip": "La méthode du canal indépendant fonctionne aussi pour les vraies alertes.", "doc": "Dossier d’enquête", "sample": ["Courriel de securite@ecole-exemple.ca (domaine exact) :", "« Une connexion inhabituelle a été détectée sur ton compte. Si ce n’était pas toi, change ton mot de passe dans le portail. »", "Aucun lien dans le message."], "consigne": "Quelle est la meilleure décision ?", "opts": ["L’ignorer : les avis de sécurité sont toujours des faux", "Le transférer à toute la classe pour l’avertir", "Répondre au courriel pour demander plus d’information", "Ouvrir toi-même le portail, vérifier tes connexions récentes et changer ton mot de passe si besoin"], "correct": 3, "why": "Les vraies alertes existent. Sans cliquer sur rien, tu vérifies dans le portail que tu ouvres toi-même : c’est sûr, que l’alerte soit vraie ou fausse."}],questions=[["Une publication publique montre ton chandail d’équipe et le nom de ton entraîneur. Le lendemain, tu reçois un message de « ton entraîneur » avec un lien. Quel enchaînement décrit le mieux l’attaque ?", ["Hameçonnage vocal → code QR → sauvegarde", "Hameçonnage de masse → lien raccourci → rançongiciel", "Bourrage d’identifiants → AMF → fuite de données", "Renseignements publics → harponnage → faux lien"], 3, "Le fraudeur part de tes publications (leçon 1) pour préparer un message ciblé (leçon 2) qui contient un faux lien (leçon 3)."], ["Un message vient de « coach@ecole-exemple.ca.equipes.example », t’appelle par ton prénom et parle du match de samedi. Combien d’éléments PROUVENT qu’il vient de ton école ?", ["Un seul : l’adresse, puisqu’elle contient « ecole-exemple.ca »", "Deux : ton prénom et le match, que seule l’école connaît", "Trois : l’adresse, ton prénom et le match de samedi", "Aucun : le domaine réel est « equipes.example » et les détails peuvent venir de tes publications"], 3, "Le domaine réel se lit à la fin et les détails personnels peuvent être trouvés en ligne. Rien ne prouve l’origine du message."], ["Ton mot de passe a fui lors du piratage d’un site de jeu. Tu l’utilisais aussi pour ton courriel (avec AMF par application) et pour ton réseau social (sans AMF). Quel compte est le plus en danger tout de suite ?", ["Les deux de la même façon, puisqu’ils utilisent le même mot de passe", "Aucun des deux, puisque la fuite concerne seulement le site de jeu", "Le réseau social, parce que le mot de passe seul suffit pour y entrer", "Le courriel, parce que c’est le compte le plus important de tous"], 2, "Sur le courriel, il manque au fraudeur la deuxième preuve. Sur le réseau social, le mot de passe volé suffit. Il faut quand même changer les deux."], ["Une fenêtre « Mise à jour obligatoire de ton navigateur » est apparue sur un site de jeux. Tu as déjà téléchargé et ouvert le fichier. Que fais-tu ?", ["Je coupe Internet, je n’utilise plus l’appareil et je préviens le soutien informatique", "Je désinstalle le navigateur, j’en installe un autre et je continue mon travail", "Je redémarre l’ordinateur et j’attends de voir si un problème apparaît", "J’installe une deuxième mise à jour depuis le même site pour corriger la première"], 0, "C’était une fausse mise à jour (leçon 4) et le fichier a été ouvert : on applique la réaction de la leçon 5."], ["Un courriel du domaine exact de l’école annonce que les bulletins sont disponibles « dans le portail ». Il n’a aucun lien. Quelle conclusion est la plus juste ?", ["Il faut le signaler, car il ne contient pas de lien", "Il faut répondre pour confirmer que tu l’as reçu", "Il n’a pas d’indice d’hameçonnage : tu peux vérifier en ouvrant toi-même le portail", "Il est faux, car les messages sur les bulletins sont souvent des pièges"], 2, "Pas de lien, pas de demande, bon domaine : aucun indice. Et ouvrir toi-même le portail est sûr dans tous les cas."], ["Tu as scanné un code QR et entré ton mot de passe sur la page. Tu utilises ce mot de passe à deux endroits. Quelle réponse contient TOUTES les bonnes actions ?", ["Signaler le code QR au secrétariat pour qu’on l’enlève, sans rien changer d’autre", "Changer les deux mots de passe, déconnecter les autres appareils et signaler le code QR", "Supprimer l’application de lecture de codes QR et effacer l’historique du téléphone", "Changer le mot de passe du compte scolaire, puisque c’est lui qui a été demandé"], 1, "Reprendre le contrôle des deux comptes, fermer les sessions du fraudeur et signaler l’affiche pour protéger les autres."], ["Un fraudeur se connecte au compte courriel d’un élève et lit ses messages, sans rien supprimer. Quel pilier est touché en premier ?", ["Aucun, puisqu’il ne supprime rien", "La confidentialité", "L’intégrité", "La disponibilité"], 1, "Une personne non autorisée lit les données : c’est la confidentialité, même si rien n’est modifié ni supprimé."], ["Un fraudeur prend le contrôle du compte de Léo et écrit à ses amis : « Tu peux me prêter 50 $ ? Je te rembourse demain, c’est urgent. » Quels leviers utilise-t-il, et quelle faiblesse a-t-il exploitée ?", ["L’autorité et la peur ; la faiblesse est une faille du téléphone de Léo", "La curiosité et l’appât du gain ; la faiblesse est un code QR piégé", "La confiance envers un ami et l’urgence ; la faiblesse est le compte mal protégé de Léo", "La peur et l’urgence ; la faiblesse est un rançongiciel sur l’ordinateur de Léo"], 2, "Les amis font confiance à Léo (leçon 2) et le message presse. La porte d’entrée était un compte mal protégé (leçon 4)."], ["Ton amie reçoit dix demandes d’approbation en pleine nuit et finit par en approuver une « pour que ça arrête ». Que s’est-il passé, et que doit-elle faire ?", ["Son téléphone est piraté : elle doit le réinitialiser complètement avant de se reconnecter à ses comptes", "Elle a laissé entrer quelqu’un qui avait son mot de passe : elle doit le changer, déconnecter les appareils et signaler", "Rien de grave : approuver une demande ne donne aucun accès sans le mot de passe, qu’elle n’a pas donné", "L’application d’authentification a un bogue : elle doit la désinstaller et la réinstaller le lendemain"], 1, "L’approbation était la dernière étape qui manquait au fraudeur. Elle applique maintenant la réaction de la leçon 5."], ["Quelle méthode permet de vérifier TOUS les messages douteux, qu’ils soient vrais ou faux ?", ["Chercher les fautes d’orthographe et les erreurs de mise en page dans le message", "Attendre de recevoir le même message une deuxième fois avant d’agir", "Passer par un canal que tu connais déjà, sans utiliser les coordonnées du message", "Vérifier que l’adresse de l’expéditeur contient bien le nom de l’organisme"], 2, "Les fautes et le nom dans l’adresse trompent facilement. Le canal indépendant est la seule méthode qui fonctionne dans tous les cas."]];
const labels=["1 · Profil exposé", "2 · Appel piège", "3 · Code QR", "4 · Vraie alerte ?", "Devoir · 10 questions"];let step=0,answers={},quizAnswers={},submitted=false,corrected=false,oldVersion=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// Lesson points: escaped text, with **word** shown in bold.
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const note=s=>s.sample.some(x=>x.includes('.example'))?'<small>Les adresses qui se terminent par .example sont inventées : cette terminaison est réservée aux exemples et ne mène à aucun vrai site.</small>':'';
// Each student sees the homework options in a different order; answers are stored with the original option numbers.
const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const order=questions.map(q=>mix(q[1].map((_,j)=>j)));
const nbBonnes=()=>questions.filter((q,i)=>quizAnswers[i]===q[2]).length;
function render(){document.getElementById('tabs').innerHTML=labels.map((s,i)=>`<button class="tab ${i===step?'active':''}" onclick="go(${i})">${s}</button>`).join('');document.getElementById('fill').style.width=((step+1)*20)+'%';document.getElementById('stepLabel').textContent=step===4?'Devoir — 10 questions':`Étape ${step+1} sur 4`;let html='';
if(step<4){const s=stages[step],sel=answers[step];html=`<div class="card cols"><div><h2>${esc(s.title)}</h2><ul class="points">${s.lead.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul><div class="callout"><b>À retenir :</b> ${esc(s.tip)}</div><h3>À toi de décider</h3><p>${esc(s.consigne)}</p><div class="choices">${s.opts.map((o,j)=>`<button class="choice ${sel===j?'selected':''}" onclick="choose(${step},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>${sel===undefined?'':`<div class="feedback ${sel===s.correct?'good':'no'}"><b>${sel===s.correct?'✓ Bonne analyse !':'↻ Observe encore les indices'}</b><p>${esc(s.why)}</p></div>`}</div><div class="visual"><div class="email"><b>🔎 ${esc(s.doc)}</b><hr>${s.sample.map(x=>`<p>${esc(x)}</p>`).join('')}${note(s)}</div><p class="hint">Observe les détails avant de répondre.</p></div></div>`;}
else if(window.TEJ2O?.devoirFait&&!submitted&&!window.TEJ2O.corrige){html=window.TEJ2O.carteDevoirFait()}else{const cor=window.TEJ2O?.corrige;html=`<div class="card">${cor?window.TEJ2O_BANDEAU_CORRIGE(oldVersion?{score:cor.score}:cor):''}${oldVersion?'<div class="oldv"><b>Ce devoir a été modifié après ton envoi.</b> Ton score reste celui de l’ancienne version. Voici les nouvelles questions avec leurs bonnes réponses.</div>':''}<h2>Devoir 6 — Enquête de synthèse</h2>${cor?'':`<p>10 questions · 1 point chacune. Lis bien chaque situation : plusieurs réponses peuvent sembler correctes, une seule est la meilleure. Clique ensuite sur <b>Envoyer le devoir</b>. Le corrigé sera disponible dans ton compte quand ton enseignant(e) le publiera.</p>`}${questions.map((q,i)=>`<div class="mini" style="margin:12px 0"><b>Question ${i+1}</b><p>${esc(q[0])}</p><div class="choices">${order[i].map((j,pos)=>`<button class="choice ${quizAnswers[i]===j?'selected':''}" onclick="quizChoose(${i},${j})" ${submitted?'disabled':''}>${String.fromCharCode(65+pos)}. ${esc(q[1][j])}</button>`).join('')}</div>${corrected?`<div class="feedback ${quizAnswers[i]===q[2]||quizAnswers[i]===undefined?'good':'no'}"><b>${quizAnswers[i]===undefined?'Bonne réponse : '+esc(q[1][q[2]]):quizAnswers[i]===q[2]?'✓ Bonne réponse':'✗ Réponse attendue : '+esc(q[1][q[2]])}</b><p>${esc(q[3])}</p></div>`:''}</div>`).join('')}<div class="nav"><span>${Object.keys(quizAnswers).length} / 10 réponses</span>${cor?'<a href="../index.html?compte" style="display:inline-block;padding:10px 16px;border-radius:10px;background:#e8c77c;color:#08231b;font-weight:800;text-decoration:none">Retour à mon compte</a>':submitted?'':`<button onclick="submitQuiz()" ${Object.keys(quizAnswers).length!==10?'disabled':''}>Envoyer le devoir</button>`}</div>${corrected&&Object.keys(quizAnswers).length===10?`<div class="callout"><div class="score">${nbBonnes()}/10</div><b>Résultat : ${nbBonnes()*10} %</b>${cor?'':'<p>Ton résultat est enregistré dans ton compte et transmis à ton enseignant(e).</p>'}</div>`:''}</div>`;}
document.getElementById('content').innerHTML=html;document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===4;document.getElementById('next').textContent=step===3?'Passer au devoir →':'Suivant →';document.getElementById('navHint').textContent=step===4?'10 questions':`${step+1} / 4 activités`;}
function choose(i,j){answers[i]=j;render()}function quizChoose(i,j){if(submitted)return;quizAnswers[i]=j;render()}
async function submitQuiz(){
 if(Object.keys(quizAnswers).length!==10||submitted)return;
 if(!window.TEJ2O?.saveScore){alert('Connecte-toi avec ton compte élève pour envoyer le devoir.');return}
 // Version 2 answers are saved as {v:2,r:[...]} so that old submissions are never compared with the new questions.
 const saved=await window.TEJ2O.saveScore("homework6",nbBonnes()*10,{v:2,r:questions.map((q,i)=>quizAnswers[i]??null)});
 if(!saved){alert("Le devoir n'a pas été envoyé. Vérifie le message d'erreur puis réessaie.");return}
 render();window.scrollTo({top:0,behavior:"smooth"});
}
// Answer key: new answers are shown against the questions; an old (version 1) submission only shows the correct answers.
function openCorrige(c){const r=c.reponses;if(r&&r.v===2&&Array.isArray(r.r)){r.r.forEach((v,i)=>{if(v!=null)quizAnswers[i]=v})}else if(Array.isArray(r)){oldVersion=true}submitted=true;corrected=true;step=4;render();window.scrollTo(0,0)}
async function go(i){
 if(i===4){
  if(!window.TEJ2O){
   try{await window.tej2oAccessReady}catch(e){console.error('Erreur de chargement de access.js',e);alert('Erreur JavaScript dans le contrôle d’accès : '+e.message);return}
   if(!window.TEJ2O){alert(window.TEJ2O_ACCESS_ERROR||'Session non reconnue. Retourne à la page de connexion, connecte-toi, puis rouvre la leçon.');return}
  }
  if(!window.TEJ2O.teacher){
   const ctx=window.TEJ2O;
   const {data,error}=await ctx.db.from('tej2o_releases').select('activity_id').eq('class_id',ctx.classId).eq('activity_id','homework6');
   if(error){alert("Impossible de vérifier la publication du devoir : "+error.message);return}
   ctx.homeworkOpen=!!data?.length;
   if(!ctx.homeworkOpen){alert("Le devoir n'est pas accessible à ce compte. Vérifie que tu es inscrit dans la bonne classe.");return}
  }
 }
