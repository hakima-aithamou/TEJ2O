<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
/* TEJ2O sign-in: same accounts, classes and students as Assiduité and Habiletés ("assiduite" server function).
   The returned session is handed to Supabase (setSession) so that access.js and site.html can read it afterwards. */
const URL_SB='https://dcnfxwtszqeqfaxlbfbl.supabase.co', KEY='sb_publishable_UTy7pKbk6xnw6mjRoy08GQ_5OuU1ymE', FN_A=URL_SB+'/functions/v1/assiduite';
const db=createClient(URL_SB,KEY);
const LABELS={lesson1:'Leçon 1',lesson2:'Leçon 2',lesson3:'Leçon 3',lesson4:'Leçon 4',lesson5:'Leçon 5',lesson6:'Leçon 6',homework1:'Devoir 1',homework2:'Devoir 2',homework3:'Devoir 3',homework4:'Devoir 4',homework5:'Devoir 5',homework6:'Devoir 6',final:'Défi final',corrigefinal:'Corrigé du défi',project:'Mini-projet',corrige1:'Corrigé 1',corrige2:'Corrigé 2',corrige3:'Corrigé 3',corrige4:'Corrigé 4',corrige5:'Corrigé 5',corrige6:'Corrigé 6'};
const path=id=>id.startsWith('lesson')?'lecon-'+id.slice(6)+'/index.html':id.startsWith('homework')?'lecon-'+id.slice(8)+'/index.html?devoir=1':id==='final'?'defi-final/index.html':'mini-projet/index.html';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s), app=$('#app');
const compte=new URLSearchParams(location.search).has('compte');
const UI={tab:location.hash==='#enseignant'?'prof':location.hash==='#eleve'?'eleve':'',mode:'login',prefill:null,info:null,forgotQ:null,classId:null,vue:'pub',flash:null};
let T=null; // teacher data

/* ---------- Server calls ---------- */
async function api(body,auth=false){
 const h={'content-type':'application/json',apikey:KEY};
 if(auth){const {data:{session}}=await db.auth.getSession();if(session)h.authorization='Bearer '+session.access_token}
 let r;try{r=await fetch(FN_A,{method:'POST',headers:h,body:JSON.stringify(body)})}catch{throw new Error('Connexion au serveur impossible. Vérifie Internet et réessaie.')}
 const d=await r.json().catch(()=>({error:'Réponse illisible du serveur.'}));
 if(!r.ok||d.error)throw new Error(d.error||'Action impossible. Réessaie.');
 return d;
}
async function moi(){const {data,error}=await db.rpc('tej2o_me');if(error)throw error;return data||{role:null}}
let ancre=null;function noterAncre(el){const sec=el?.closest('[data-ancre]');ancre=sec?{k:sec.dataset.ancre,top:sec.getBoundingClientRect().top}:null}
function garderPosition(fn){const y=window.scrollY,a=ancre;ancre=null;fn();if(a){const el=document.querySelector(`[data-ancre="${a.k}"]`);if(el){window.scrollTo(0,window.scrollY+el.getBoundingClientRect().top-a.top);return}}window.scrollTo(0,y)}
let flashT;function message(t,ok=true){UI.flash={t,ok};const z=$('#flash');if(z){z.innerHTML=`<div class="msg ${ok?'ok':'err'}" role="status">${esc(t)}</div>`;clearTimeout(flashT);flashT=setTimeout(()=>{z.innerHTML='';UI.flash=null},ok?4000:9000)}}

/* ---------- Startup ---------- */
async function demarrer(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){renderLogin();return}
 let m;try{m=await moi()}catch(e){app.innerHTML=`<div class="panel"><div class="msg err">${esc(e.message)}</div></div>`;return}
 if(m.role==='teacher'){await chargerProf();return}
 if(m.role==='student'){if(compte){await renderCompte(m)}else location.replace('site.html');return}
 await db.auth.signOut();UI.info=null;renderLogin('Ce compte n’est pas un compte élève ou enseignant de TEJ2O. Connecte-toi avec ton prénom, ton nom et ton mot de passe.');
}


/* ---------- "How do I sign in?" guide (same as Assiduité) ---------- */
const GUIDE={eleve:{premiere:[
 {v:'',c:'.role[data-tab="eleve"]',t:'Sur la page d’accueil, clique sur',b:'Je suis élève',f:'Clique ici'},
 {v:'eleve',m:'login',c:'[data-mode="identify"]',t:'Clique sur le lien',b:'S’identifier pour recevoir mon mot de passe',f:'Clique ici'},
 {v:'eleve',m:'identify',c:'#lFirst,#lLast',t:'Écris ton prénom, puis ton nom.',f:'Écris ici'},
 {v:'eleve',m:'identify',c:'#loginBtn',t:'Clique sur le bouton',b:'S’identifier',f:'Clique ici'},
 {t:'Ton mot de passe s’affiche pendant 30 secondes, une seule fois. Prends une capture d’écran ou écris-le sur une feuille.',ic:'📸'},
 {t:'Ensuite, connecte-toi : regarde « Les autres fois ».',ic:'➡️'}],
 ensuite:[
 {v:'',c:'.role[data-tab="eleve"]',t:'Sur la page d’accueil, clique sur',b:'Je suis élève',f:'Clique ici'},
 {v:'eleve',m:'login',c:'#lFirst,#lLast',t:'Écris ton prénom et ton nom.',f:'Écris ici'},
 {v:'eleve',m:'login',c:'#lPass',t:'Écris ton mot de passe (celui de ta capture d’écran).',f:'Écris ici'},
 {v:'eleve',m:'login',c:'#loginBtn',t:'Clique sur le bouton',b:'Se connecter',f:'Clique ici'},
 {t:'C’est le même mot de passe que pour Assiduité et Habiletés. Si tu l’as déjà récupéré là-bas, connecte-toi directement.',ic:'🔑'}]},
 prof:{premiere:[
 {v:'',c:'.role[data-tab="prof"]',t:'Sur la page d’accueil, clique sur',b:'Je suis enseignant(e)',f:'Clique ici'},
 {v:'prof',m:'login',c:'[data-mode="signup"]',t:'Clique sur le lien',b:'Créer un compte',f:'Clique ici'},
 {v:'prof',m:'signup',c:'#lFirst,#lLast',t:'Écris ton prénom, puis ton nom.',f:'Écris ici'},
 {v:'prof',m:'signup',c:'#lPass,#lPass2',t:'Choisis ton mot de passe (8 caractères ou plus) et écris-le deux fois.',f:'Écris ici'},
 {v:'prof',m:'signup',c:'#lQ,#lA',t:'Écris une question secrète et sa réponse. Elles te serviront si tu oublies ton mot de passe.',f:'Écris ici'},
 {v:'prof',m:'signup',c:'#loginBtn',t:'Clique sur le bouton',b:'Créer mon compte',f:'Clique ici'},
 {t:'Attends que Mme Hakima approuve ton compte. Ensuite, connecte-toi comme dans « Les autres fois ».',ic:'⏳'}],
 ensuite:[
 {v:'',c:'.role[data-tab="prof"]',t:'Sur la page d’accueil, clique sur',b:'Je suis enseignant(e)',f:'Clique ici'},
 {v:'prof',m:'login',c:'#lFirst,#lLast',t:'Écris ton prénom et ton nom.',f:'Écris ici'},
 {v:'prof',m:'login',c:'#lPass',t:'Écris ton mot de passe.',f:'Écris ici'},
 {v:'prof',m:'login',c:'#loginBtn',t:'Clique sur le bouton',b:'Se connecter',f:'Clique ici'},
 {t:'C’est le même compte et le même mot de passe que pour Assiduité et Habiletés.',ic:'🔑'}]}};
let gMin=null,gJeton=0;
const gRole=()=>UI.tab||UI.guideRole||'eleve', gQuand=()=>UI.guideQuand||(UI.mode==='identify'?'premiere':UI.tab==='eleve'&&UI.mode==='login'?'ensuite':'premiere'), gListe=()=>GUIDE[gRole()][gQuand()];
function guideHtml(){const r=gRole(),q=gQuand(),L=gListe();let n=0;
 return`<aside class="guide panel" aria-label="Comment me connecter"><h2>🧭 Comment me connecter ?</h2>
 ${!UI.tab?`<div class="tabs"><button class="tab ${r==='eleve'?'on':''}" data-grole="eleve">Je suis élève</button><button class="tab ${r==='prof'?'on':''}" data-grole="prof">Je suis enseignant(e)</button></div>`:''}
 <div class="tabs"><button class="tab ${q==='premiere'?'on':''}" data-gquand="premiere">${r==='eleve'?'1. La première fois : s’identifier':'La première fois'}</button><button class="tab ${q==='ensuite'?'on':''}" data-gquand="ensuite">${r==='eleve'?'2. Les autres fois : se connecter':'Les autres fois'}</button></div>
 <ol class="g-etapes">${L.map((o,i)=>`<li data-gi="${i}"><span class="g-num">${o.ic?o.ic:++n}</span><div>${esc(o.t)}${o.b?` <span class="g-chip">${esc(o.b)}</span>`:''}</div>${o.c?`<button class="ghost small g-voir" data-gvoir="${i}">👉 Montre-moi</button>`:''}</li>`).join('')}</ol>
 <button data-gtout="1">▶ Montre-moi toutes les étapes</button></aside>`}
function guideEffacer(){clearTimeout(gMin);gMin=null;document.querySelectorAll('.g-fleche').forEach(e=>e.remove());document.querySelectorAll('.g-cible').forEach(e=>e.classList.remove('g-cible'));document.querySelectorAll('.g-etapes li.g-actif').forEach(e=>e.classList.remove('g-actif'))}
function guideAller(o){if(o.v===undefined)return;if(o.v===''){if(UI.tab){UI.guideRole=UI.tab;UI.tab='';UI.mode='login';UI.prefill=null;renderLogin()}return}
 if(UI.tab!==o.v||UI.mode!==o.m){UI.tab=o.v;UI.mode=o.m;UI.prefill=null;UI.info=null;UI.forgotQ=null;renderLogin()}}
function guideMontrer(i){guideEffacer();UI.guideRole=gRole();UI.guideQuand=gQuand();const o=gListe()[i];if(!o)return;guideAller(o);
 const li=document.querySelector(`.g-etapes li[data-gi="${i}"]`);if(li)li.classList.add('g-actif');if(!o.c)return;
 const t=[...document.querySelectorAll(o.c)];if(!t.length)return;t.forEach(e=>e.classList.add('g-cible'));t[0].scrollIntoView({block:'center',behavior:'smooth'});
 const j=++gJeton;setTimeout(()=>{if(j===gJeton)guidePlacer(t[0],o.f||'Clique ici')},450)}
function guidePlacer(el,txt){document.querySelectorAll('.g-fleche').forEach(e=>e.remove());const r=el.getBoundingClientRect(),dessous=r.top<110,d=document.createElement('div');
 d.className='g-fleche'+(dessous?' dessous':'');d.setAttribute('aria-hidden','true');d.innerHTML=`<span class="g-bulle">${esc(txt)}</span><svg viewBox="0 0 60 70" width="54" height="63"><path d="M22 2h16v38h16L30 68 6 40h16z" fill="#e8553d" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>`;
 document.body.append(d);const w=d.offsetWidth,h=d.offsetHeight,x=Math.max(6,Math.min(innerWidth-w-6,r.left+Math.min(r.width/2,120)-w/2));d.style.left=x+scrollX+'px';d.style.top=(dessous?r.bottom+6:r.top-h-6)+scrollY+'px'}

/* ---------- Sign-in (same as Assiduité) ---------- */
function renderLogin(err){
 const entete=`<header><h1>🛡️ TEJ2O — Cyberdétectives</h1><p>Connexion avec ton prénom, ton nom et ton mot de passe. C’est le même compte que pour Assiduité et Habiletés.</p></header>`;
 if(!UI.tab){
  app.innerHTML=entete+(err?`<div class="msg err">${esc(err)}</div>`:'')+`<div class="roles"><button class="role" data-tab="eleve"><span class="ico">🎒</span><b>Je suis élève</b><span>Je fais les leçons et j’envoie mes devoirs.</span></button><button class="role" data-tab="prof"><span class="ico">🧑‍🏫</span><b>Je suis enseignant(e)</b><span>Je publie les leçons et les devoirs et je vois les résultats.</span></button></div><div class="panel" style="max-width:880px;margin:18px auto 0"><b>🎒 Élève : 2 étapes</b><ol style="margin:8px 0 0"><li><b>La première fois</b>, clique sur « Je suis élève », puis sur <b>« S’identifier »</b> : ton mot de passe s’affiche une seule fois. Note-le !</li><li><b>Les autres fois</b>, clique sur « Je suis élève » et <b>« Se connecter »</b> avec ton prénom, ton nom et ce mot de passe.</li></ol><small>Tu as déjà ton mot de passe d’Assiduité ? C’est le même : passe directement à l’étape 2.</small></div>`+guideHtml();
  return;
 }
 const eleve=UI.tab==='eleve',m=UI.mode,ident=eleve&&m==='identify',sg=!eleve&&m==='signup',fg=!eleve&&m==='forgot',q=fg?UI.forgotQ:null;
 const titre=eleve?(ident?'Première connexion':'Espace élève'):sg?'Créer mon compte':fg?'Mot de passe oublié':'Espace enseignant';
 const intro=eleve?(ident?'Écris ton prénom et ton nom. Ton mot de passe s’affichera pendant 30 secondes, une seule fois : prends une capture d’écran ou écris-le.':'Connecte-toi avec ton prénom, ton nom et ton mot de passe. Pas encore de mot de passe ? Clique d’abord sur « S’identifier » plus bas.')
  :sg?'Choisis ton mot de passe et une question secrète. Ton compte sera actif dès que Mme Hakima l’aura approuvé. Ce compte sert aussi pour Assiduité et Habiletés.'
  :fg?(q?'Réponds à ta question secrète, puis choisis un nouveau mot de passe.':'Écris ton prénom et ton nom pour afficher ta question secrète.'):'Connecte-toi avec ton prénom, ton nom et ton mot de passe (le même que dans Assiduité).';
 const ro=fg&&q?' readonly':'';

async function soumettre(){
 const first=$('#lFirst').value.trim(),last=$('#lLast').value.trim(),msg=$('#loginMsg'),btn=$('#loginBtn'),lab=btn.textContent,v=id=>$(id)?$(id).value:'';
 const prof=UI.tab==='prof',m=UI.mode;msg.innerHTML='';
 if(!first||!last){msg.innerHTML='<div class="msg err">Écris le prénom et le nom.</div>';return}
 btn.disabled=true;btn.textContent='Un instant…';
 try{
  if(m==='identify'){const r=await api({action:'student_identify',first,last});UI.mode='login';UI.prefill={first:r.first_name,last:r.last_name};renderLogin();fiche(r.first_name+' '+r.last_name,r.password,true);return}
  if(prof&&m==='signup'){
   const p=v('#lPass'),p2=v('#lPass2'),qq=v('#lQ').trim(),ra=v('#lA').trim();
   if(p.length<8)throw new Error('Le mot de passe doit avoir 8 caractères ou plus.');if(p!==p2)throw new Error('Les deux mots de passe ne sont pas identiques.');
   if(qq.length<3)throw new Error('Écris ta question secrète.');if(!ra)throw new Error('Écris la réponse à ta question secrète.');
   const r=await api({action:'teacher_signup',first,last,password:p,question:qq,answer:ra});UI.mode='login';UI.prefill={first,last};UI.info=r.message;renderLogin();return;
  }
  if(prof&&m==='forgot'){
   if(!UI.forgotQ){const r=await api({action:'teacher_forgot_question',first,last});UI.forgotQ=r.question;UI.prefill={first,last};renderLogin();return}
   const ra=v('#lA').trim(),p=v('#lPass'),p2=v('#lPass2');
   if(!ra)throw new Error('Écris ta réponse.');if(p.length<8)throw new Error('Le nouveau mot de passe doit avoir 8 caractères ou plus.');if(p!==p2)throw new Error('Les deux mots de passe ne sont pas identiques.');
   const r=await api({action:'teacher_forgot_reset',first,last,answer:ra,password:p});UI.mode='login';UI.forgotQ=null;UI.prefill={first,last};UI.info=r.message;renderLogin();return;
  }
  const password=v('#lPass');if(!password)throw new Error('Écris le mot de passe.');
  const r=await api({action:prof?'teacher_login':'student_login',first,last,password});
  const {error}=await db.auth.setSession({access_token:r.session.access_token,refresh_token:r.session.refresh_token});
  if(error)throw new Error('Session refusée : '+error.message);
  UI.info=null;UI.prefill=null;app.innerHTML='<p>Chargement…</p>';await demarrer();
 }catch(err){msg.innerHTML=`<div class="msg err">${esc(err.message)}</div>`;btn.disabled=false;btn.textContent=lab}
}

let xlsxPret=null;
function chargerXLSX(){if(window.XLSX)return Promise.resolve();if(xlsxPret)return xlsxPret;
 xlsxPret=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>{xlsxPret=null;ko(new Error('Le module Excel n’a pas pu se charger. Vérifie Internet et réessaie.'))};document.head.append(s)});return xlsxPret}
const fichierNom=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'');
const dateFr=iso=>iso?new Date(iso).toLocaleString('fr-CA',{dateStyle:'medium',timeStyle:'short'}):'';
function lignesEleve(s){
 const hw=[1,2,3,4,5,6].map(i=>'homework'+i),rows=[];let somme=0,n=0;
 for(const a of hw){const r=T.res.find(x=>x.student_id===s.id&&x.activity_id===a),p=T.rel?.get(a);
  const statut=r?'Envoyé':!p||!p.enabled?'Non publié':ouvert(p)?'À faire':'Publié le '+dateFr(p.available_at);
  if(r){somme+=r.score;n++}rows.push([LABELS[a],statut,r?r.score:'',r?dateFr(r.completed_at):''])}
 return {rows,moy:n?Math.round(somme/n):'',n};
}
function feuilleEleve(s,c){
 const {rows,moy,n}=lignesEleve(s);
 const aoa=[['TEJ2O — Résultats de l’élève'],['Élève',s.first_name+' '+s.last_name],['Classe',c.name],['Exporté le',dateFr(new Date().toISOString())],[],['Devoir','Statut','Note (%)','Date d’envoi'],...rows,[],['Devoirs envoyés',n+' / 6'],['Moyenne des devoirs envoyés (%)',moy]];
 const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:32},{wch:24},{wch:10},{wch:24}];ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:3}}];return ws;
}
async function excel(mode,sid){
 try{
  await chargerXLSX();const c=classeCourante(),el=elevesClasse(),wb=XLSX.utils.book_new();let nom;
  if(mode==='eleve'){const s=T.students.find(x=>x.id===sid);XLSX.utils.book_append_sheet(wb,feuilleEleve(s,c),'Résultats');nom='TEJ2O_'+fichierNom(c.name)+'_'+fichierNom(s.last_name+'_'+s.first_name)}
  else{
   const hw=[1,2,3,4,5,6].map(i=>'homework'+i);
   const aoa=[['TEJ2O — Résultats de la classe '+c.name],['Exporté le',dateFr(new Date().toISOString())],[],['Nom','Prénom',...hw.map(a=>LABELS[a]+' (%)'),'Devoirs envoyés','Moyenne (%)','Défi final (%)','Sorties (défi)']];
   for(const s of el){const {rows,moy,n}=lignesEleve(s);const f=T.res.find(x=>x.student_id===s.id&&x.activity_id==='final');aoa.push([s.last_name,s.first_name,...rows.map(r=>r[2]),n+' / 6',moy,f?f.score:'',f?(f.answers?.sorties||[]).length:''])}
   const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:20},{wch:18},...hw.map(()=>({wch:12})),{wch:16},{wch:13},{wch:14},{wch:14}];XLSX.utils.book_append_sheet(wb,ws,'Classe');
   if(mode==='tous'){const pris=new Set();for(const s of el){let t=(s.last_name+' '+s.first_name).replace(/[\\/?*[\]:]/g,'').slice(0,28)||'Élève';let u=t,i=2;while(pris.has(u.toLowerCase()))u=t.slice(0,26)+' '+i++;pris.add(u.toLowerCase());XLSX.utils.book_append_sheet(wb,feuilleEleve(s,c),u)}}
   nom='TEJ2O_'+fichierNom(c.name)+(mode==='tous'?'_par_eleve':'_classe');
  }

async function renderCompte(m){
 // The student account shows every published or sent homework with a green check (done) or a red X (not done yet).
 const ids=m.classes.map(c=>c.id);
 const [{data:rel,error:e1},{data:res,error:e2}]=await Promise.all([
  ids.length?db.from('tej2o_releases').select('class_id,activity_id,enabled,available_at').in('class_id',ids):{data:[]},
  db.from('tej2o_results').select('class_id,activity_id,score,completed_at')]);
 if(e1||e2){app.innerHTML=`<div class="panel"><div class="msg err">${esc((e1||e2).message)}</div></div>`;return}
 const {data:coche}=await db.from('tej2o_final_students').select('class_id');const defiOk=new Set((coche||[]).map(x=>x.class_id));
 const hw=[1,2,3,4,5,6].map(n=>'homework'+n);
 app.innerHTML=`<div class="top"><div><h1>🎒 Mon compte</h1><div class="sub">${esc(m.first_name)} ${esc(m.last_name)}</div></div><div class="act"><a href="site.html">← Leçons et devoirs</a><button class="ghost" id="sortir">Se déconnecter</button></div></div>`+
 (m.classes.length?m.classes.map(c=>{
  const open=new Set((rel||[]).filter(r=>r.class_id===c.id&&ouvert(r)).map(r=>r.activity_id));
  if(!defiOk.has(c.id))open.delete('final');
  // Answer key link: only when the teacher published it and the homework was sent.
  const corrige=(a,r)=>!r?'<span class="sub">—</span>':open.has('corrige'+a.slice(8))?`<a href="lecon-${a.slice(8)}/index.html?corrige=1"><b>📝 Voir le corrigé</b></a>`:'<span class="sub">🔒 Pas encore</span>';
  const done=new Map((res||[]).filter(r=>r.class_id===c.id).map(r=>[r.activity_id,r]));
  const lignes=hw.filter(a=>open.has(a)||done.has(a));
  const faits=lignes.filter(a=>done.has(a)).map(a=>done.get(a));
  const moy=faits.length?Math.round(faits.reduce((t,r)=>t+r.score,0)/faits.length):null;
  return`<section class="panel"><h2>📝 Mes devoirs — ${esc(c.name)}</h2>${lignes.length?`<p>${faits.length} devoir${faits.length>1?'s':''} fait${faits.length>1?'s':''} sur ${lignes.length}.</p><div class="tbl"><table style="min-width:600px"><thead><tr><th class="c">État</th><th>Devoir</th><th>Date de réalisation</th><th class="c">Score</th><th>Corrigé</th></tr></thead><tbody>${lignes.map(a=>{const r=done.get(a);return`<tr><td class="c">${r?'<span class="etat ok" title="Fait" aria-label="Fait">✓</span>':'<span class="etat non" title="Pas encore fait" aria-label="Pas encore fait">✗</span>'}</td><td>${r?`<b>${esc(LABELS[a])}</b>`:`<a href="${path(a)}"><b>${esc(LABELS[a])}</b></a>`}</td><td>${r?new Date(r.completed_at).toLocaleString('fr-CA',{dateStyle:'long',timeStyle:'short'}):'<span class="sub">À faire</span>'}</td><td class="c">${r?`<span class="sc">${r.score} %</span>`:'—'}</td><td>${corrige(a,r)}</td></tr>`}).join('')}</tbody>${faits.length>1?`<tfoot><tr><th></th><th colspan="2">Moyenne des devoirs faits</th><th class="c">${moy} %</th><th></th></tr></tfoot>`:''}</table></div>`:'<p>Aucun devoir n’est publié pour le moment.</p>'}${defiEleve(open,done)}${projetEleve(open)}</section>`}).join('')
 :'<div class="panel"><p>Tu n’es inscrit(e) dans aucune classe TEJ2O. Demande à ton enseignant(e) de t’ajouter.</p></div>');
}
demarrer();
</script></body></html>
