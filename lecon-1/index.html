ize:13px;box-shadow:0 8px 22px #0005}.email strong{color:#9b3d29}.email .link{color:#2058a6;text-decoration:underline;overflow-wrap:anywhere}.callout{background:#214738;border-left:4px solid var(--gold);padding:11px 13px;border-radius:7px;margin:12px 0}.choices{display:grid;gap:9px;margin:15px 0}.choice{width:100%;text-align:left;border:1px solid #4e7766;background:#174134;color:var(--text);padding:12px 14px;font-weight:500}.choice:hover{background:#245a47}.choice.selected{border-color:var(--gold);background:#36553c}.feedback{border-radius:9px;padding:12px 14px;margin:12px 0;background:#274d3c}.feedback.good{border:1px solid #85c99b}.feedback.no{border:1px solid #e8ac88}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 0 28px}.nav button:first-child{background:transparent;color:var(--gold);border:1px solid var(--gold)}.hint{color:var(--muted);font-size:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:12px;padding:12px;background:#173d32}.mini b{color:var(--gold)}.hidden{display:none!important}.score{font-size:37px;font-weight:800;color:var(--gold)}.check{color:var(--ok)}.cross{color:var(--bad)}.oldv{background:#3b2a12;border:1px solid #b8893b;border-radius:10px;padding:10px 14px;margin:10px 0}.points{margin:6px 0 14px;padding-left:20px}.points li{margin:7px 0}.points b{color:var(--gold)}.footer{color:var(--muted);font-size:12px;text-align:center;padding:18px}@media(max-width:700px){.cols,.grid3{grid-template-columns:1fr}.intro{display:block}.card{padding:15px}.shell{padding:12px}.tab{font-size:12px;padding:7px 9px}}
</style><style id="tej2o-nav-style">.tej-nav{position:sticky;top:0;z-index:9999;background:#071d18;border-bottom:1px solid #416b59;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 14px system-ui, sans-serif;color:#f7f3e6}.tej-nav a{color:#f2d28a;text-decoration:none;border:1px solid #9a8050;border-radius:9px;padding:7px 12px}.tej-nav a:focus-visible{outline:3px solid white}.tej-nav span{font-weight:400;font-size:12px;color:#bfd2c9}@media(max-width:600px){.tej-nav span{display:none}.tej-nav{font-size:12px}}</style></head><body data-activity="lesson1"><nav class="tej-nav" aria-label="Navigation principale"><a href="../site.html">← Accueil TEJ2O</a><span>Cyberdétectives · Parcours interactif</span><a href="../mini-projet/index.html">Mini-projet</a></nav><main class="shell"><header class="top"><div><div class="brand">TEJ2O <span style="color:#fff;font-weight:400">| Cyberdétectives</span></div><div class="small">Leçon 1 — Les bases de la cybersécurité</div></div><span class="pill">Parcours interactif</span></header><div class="intro"><div><h1>Qu’est-ce qu’on protège, et contre quoi ?</h1><div class="small">Quatre notions de base, puis un devoir de dix questions.</div></div><div class="small" id="stepLabel"></div></div><div class="tabs" id="tabs"></div><div class="progress"><div class="fill" id="fill"></div></div><section id="content" aria-live="polite"></section><div class="nav"><button id="prev">← Précédent</button><span class="hint" id="navHint"></span><button id="next">Suivant →</button></div><div class="footer">TEJ2O · Cyberdétectives</div></main><script>
const stages=[{"title": "Menace, vulnérabilité, risque", "lead": ["**Ce qu’on protège** : tes fichiers, tes comptes, tes photos, tes appareils.", "**Une menace** : ce qui peut causer un dommage. Par exemple un fraudeur, une panne, ou un **logiciel malveillant** (un programme créé pour nuire : voler, espionner ou bloquer).", "**Une vulnérabilité** : une faiblesse dont une menace peut profiter. Par exemple un appareil jamais mis à jour ou un mot de passe facile à deviner.", "**Le risque** : la chance qu’une menace profite d’une faiblesse, et la gravité des dégâts si ça arrive."], "tip": "On ne peut presque jamais faire disparaître la menace. Pour réduire un risque, on corrige la vulnérabilité.", "doc": "Situation à analyser", "sample": ["La tablette de la classe n’a pas été mise à jour depuis un an.", "Un logiciel malveillant connu exploite justement cette ancienne version.", "La tablette contient les photos et les travaux des élèves."], "consigne": "Dans cette situation, quelle est la vulnérabilité ?", "opts": ["La version non mise à jour de la tablette.", "Les photos et les travaux des élèves.", "La possibilité de perdre les travaux.", "Le logiciel malveillant qui circule."], "correct": 0, "why": "La faiblesse, c’est la version non mise à jour. Le logiciel malveillant est la menace, les photos et les travaux sont ce qu’on protège, et la possibilité de les perdre décrit le risque."}, {"title": "Les 3 piliers de la cybersécurité", "lead": ["**Confidentialité** : seules les personnes autorisées peuvent voir les données. Ex. : ton dossier scolaire.", "**Intégrité** : les données restent exactes ; personne ne les modifie sans permission. Ex. : tes notes.", "**Disponibilité** : on peut utiliser le système quand on en a besoin. Ex. : le portail le soir de la remise d’un travail.", "Un **rançongiciel** est un logiciel malveillant qui bloque les fichiers et demande de l’argent (une rançon) pour les débloquer."], "tip": "Un incident peut toucher plusieurs piliers. Demande-toi lequel est touché en premier.", "doc": "Incident à analyser", "sample": ["Un rançongiciel bloque tous les fichiers du serveur de l’école.", "Les fichiers sont toujours là, mais personne ne peut les ouvrir.", "Les fraudeurs exigent un paiement pour les débloquer."], "consigne": "Quel pilier est touché en premier ?", "opts": ["La disponibilité, car personne ne peut plus utiliser les fichiers.", "L’intégrité, car les fichiers ont été transformés.", "La confidentialité, car des fraudeurs ont touché aux fichiers.", "Aucun, car les fichiers n’ont pas été supprimés."], "correct": 0, "why": "Les personnes autorisées ne peuvent plus utiliser leurs fichiers : c’est d’abord la disponibilité. Certains rançongiciels copient aussi les fichiers avant de les bloquer : la confidentialité peut alors être touchée en plus."}, {"title": "Tes données ont de la valeur", "lead": ["**Un renseignement personnel** permet de te reconnaître : nom, adresse, date de naissance, photo, nom d’utilisateur.", "Seul, un détail semble sans importance. **Combinés**, plusieurs détails permettent de te retrouver ou de te faire passer pour toi.", "**Ta trace numérique**, c’est tout ce que tu laisses en ligne. Elle peut être copiée ou capturée et rester longtemps, même si tu la supprimes."], "tip": "Avant de publier, demande-toi ce qu’on peut déduire en combinant cette publication avec tes autres publications.", "doc": "Profil public à analyser", "sample": ["Profil public de Noah", "Photo de profil : devant l’entrée de son école", "Bio : « 15 ans · gardien de but des Aigles »", "Publication : « Mon chien Biscuit a 3 ans aujourd’hui ! »"], "consigne": "Quel est le plus grand problème de ce profil ?", "opts": ["Le nom de son chien, qui est à lui seul un renseignement très sensible.", "La combinaison des détails, qui indique où le trouver et donne des réponses à des questions secrètes.", "Son âge, qui suffit à lui seul à voler son identité.", "La photo de profil, car une photo publique est toujours interdite."], "correct": 1, "why": "Aucun détail n’est grave seul, mais ensemble ils révèlent son école, son équipe et son âge. Le nom d’un animal est aussi une réponse fréquente aux questions secrètes. C’est l’effet de combinaison."}, {"title": "Qui attaque, et pourquoi ?", "lead": ["La plupart des attaques ne visent **personne en particulier** : le même piège est envoyé à des milliers de personnes. Il suffit que quelques-unes tombent dedans.", "**Pourquoi ?** Surtout pour l’argent (fraude, rançon, revente de comptes) ou pour entrer ailleurs : un compte d’élève peut ouvrir la porte au réseau de l’école.", "Ton compte a aussi de la valeur : **tes amis font confiance** aux messages qui viennent de toi."], "tip": "« Je n’ai rien d’intéressant » est un mythe : ton compte peut servir à piéger tes amis.", "doc": "Situation à analyser", "sample": ["Un fraudeur prend le contrôle du compte de jeu d’un élève.", "Il ne touche pas aux objets du jeu.", "Il envoie des messages à tous les amis de l’élève."], "consigne": "Pourquoi ce compte a-t-il de la valeur pour le fraudeur ?", "opts": ["Parce que le fraudeur veut améliorer son classement dans le jeu.", "Parce que les objets du jeu peuvent être revendus très cher.", "Parce qu’un compte de jeu contient toujours un numéro de carte bancaire.", "Parce que les amis font confiance aux messages qui viennent de ce compte."], "correct": 3, "why": "Le fraudeur se sert de la confiance des amis : un message qui vient d’un ami connu est beaucoup plus crédible. Tu verras en leçon 2 comment les fraudeurs exploitent cette confiance."}],questions=[["Situation : « Un employé clique sur un faux lien et donne son mot de passe. » Qu’est-ce qui joue le rôle de la vulnérabilité ?", ["La perte possible des données de l’entreprise", "Le manque de vigilance de l’employé face aux faux liens", "Le mot de passe de l’employé", "Le fraudeur qui a envoyé le faux lien"], 1, "La faiblesse exploitée est humaine : le manque de vigilance. Le fraudeur est la menace, le mot de passe est ce qu’on protège et la perte de données décrit les conséquences."], ["Quelle mesure réduit un risque en agissant sur la vulnérabilité ?", ["Éviter de parler de cybersécurité pour ne pas attirer les fraudeurs", "Porter plainte contre les fraudeurs qui envoient des faux messages", "Acheter un téléphone plus récent chaque année", "Installer les mises à jour du téléphone dès qu’elles sont offertes"], 3, "Une mise à jour corrige une faiblesse connue. Porter plainte vise la menace (sans la faire disparaître) et un téléphone neuf finit lui aussi par avoir des failles s’il n’est pas mis à jour."], ["Deux incidents : (A) un hôpital perd l’accès à ses dossiers pendant deux jours ; (B) un hôpital découvre que des doses de médicaments ont été modifiées dans ses dossiers. Quels piliers sont touchés en premier ?", ["A : disponibilité · B : intégrité", "A : intégrité · B : disponibilité", "A : disponibilité · B : confidentialité", "A : confidentialité · B : intégrité"], 0, "Ne plus pouvoir accéder aux dossiers touche la disponibilité. Des données modifiées sans autorisation touchent l’intégrité."], ["Un élève photographie l’écran d’un enseignant où l’on voit les notes de toute la classe, puis publie la photo. Quel pilier est touché ?", ["La disponibilité, car l’enseignant ne peut plus voir les notes", "L’intégrité, car les notes sont maintenant fausses", "La confidentialité, car des personnes non autorisées voient les notes", "Aucun, car aucun système n’a été piraté"], 2, "Pas besoin de piratage : une fuite par photo rend les notes visibles à des personnes non autorisées. C’est la confidentialité."], ["Lequel de ces renseignements, publié seul, est le PLUS risqué ?", ["Le titre de ton film préféré", "Le nom de ton sport préféré", "Ta date de naissance complète", "Ta couleur préférée"], 2, "La date de naissance complète sert souvent à vérifier une identité. Avec ton nom, elle peut aider quelqu’un à se faire passer pour toi."], ["Pourquoi supprimer une publication ne la fait-elle pas toujours disparaître ?", ["Parce qu’une publication supprimée reste visible pour les personnes qui l’avaient aimée", "Parce qu’elle a pu être copiée, capturée ou partagée avant que tu la supprimes", "Parce que la suppression fonctionne seulement sur ordinateur", "Parce que les réseaux sociaux la gardent visible pour tes amis pendant 30 jours"], 1, "Ta trace numérique peut être capturée ou partagée en quelques secondes. Une fois copiée, tu n’as plus de contrôle sur elle."], ["Jonas publie, à des jours différents : une photo du parc à côté de chez lui, une photo de son autobus scolaire avec le numéro de la route, et « je rentre toujours seul à 15 h 30 ». Quel est le vrai problème ?", ["Le seul problème est l’heure, car elle est trop précise", "Les photos d’autobus scolaires sont interdites sur les réseaux sociaux", "Combinées, elles indiquent où il habite, par où il passe et quand il est seul", "Chacune de ces publications est très dangereuse à elle seule"], 2, "C’est l’effet de combinaison : chaque publication paraît banale, mais ensemble elles permettent de savoir où et quand trouver Jonas seul."], ["Pourquoi un fraudeur enverrait-il le même faux message à 50 000 personnes ?", ["Parce qu’il connaît personnellement chaque destinataire", "Parce que c’est la seule façon de contourner les antivirus", "Parce que les messages envoyés en grand nombre paraissent plus officiels", "Parce qu’il suffit que quelques personnes se fassent piéger pour que ce soit payant"], 3, "L’hameçonnage de masse coûte presque rien à envoyer. Même si une très petite partie des gens tombe dans le piège, le fraudeur y gagne."], ["Un ami dit : « Personne ne voudrait pirater mon compte, je n’ai rien d’important. » Quelle réponse est la plus juste ?", ["Il a tort seulement s’il a plus de 1000 abonnés", "Il a tort : son compte peut servir à tromper ses contacts ou être revendu", "Il a raison : seuls les comptes de personnes connues sont visés", "Il a raison si aucun de ses comptes n’est relié à une carte bancaire"], 1, "Un compte ordinaire a de la valeur : la confiance de ses contacts, l’accès à d’autres services, ou la revente."], ["Classe ces appareils du plus faible au plus grand risque : (A) un vieux portable jamais branché à Internet, rangé dans un tiroir ; (B) un ordinateur connecté, jamais mis à jour, utilisé pour les comptes scolaires ; (C) un ordinateur connecté et à jour, utilisé pour les comptes scolaires.", ["A, B, C", "B, C, A", "C, A, B", "A, C, B"], 3, "A n’est presque pas exposé. C est exposé, mais ses failles connues sont corrigées. B combine une exposition et une vulnérabilité : c’est le plus risqué."]];
const labels=["1 · Menace et risque", "2 · Les 3 piliers", "3 · Tes données", "4 · Qui attaque ?", "Devoir · 10 questions"];let step=0,answers={},quizAnswers={},submitted=false,corrected=false,oldVersion=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// Lesson points: escaped text, with **word** shown in bold.
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const note=s=>s.sample.some(x=>x.includes('.example'))?'<small>Les adresses qui se terminent par .example sont inventées : cette terminaison est réservée aux exemples et ne mène à aucun vrai site.</small>':'';
// Each student sees the homework options in a different order; answers are stored with the original option numbers.
const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const order=questions.map(q=>mix(q[1].map((_,j)=>j)));
const nbBonnes=()=>questions.filter((q,i)=>quizAnswers[i]===q[2]).length;
function render(){document.getElementById('tabs').innerHTML=labels.map((s,i)=>`<button class="tab ${i===step?'active':''}" onclick="go(${i})">${s}</button>`).join('');document.getElementById('fill').style.width=((step+1)*20)+'%';document.getElementById('stepLabel').textContent=step===4?'Devoir — 10 questions':`Étape ${step+1} sur 4`;let html='';
if(step<4){const s=stages[step],sel=answers[step];html=`<div class="card cols"><div><h2>${esc(s.title)}</h2><ul class="points">${s.lead.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul><div class="callout"><b>À retenir :</b> ${esc(s.tip)}</div><h3>À toi de décider</h3><p>${esc(s.consigne)}</p><div class="choices">${s.opts.map((o,j)=>`<button class="choice ${sel===j?'selected':''}" onclick="choose(${step},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>${sel===undefined?'':`<div class="feedback ${sel===s.correct?'good':'no'}"><b>${sel===s.correct?'✓ Bonne analyse !':'↻ Observe encore les indices'}</b><p>${esc(s.why)}</p></div>`}</div><div class="visual"><div class="email"><b>🔎 ${esc(s.doc)}</b><hr>${s.sample.map(x=>`<p>${esc(x)}</p>`).join('')}${note(s)}</div><p class="hint">Observe les détails avant de répondre.</p></div></div>`;}
else if(window.TEJ2O?.devoirFait&&!submitted&&!window.TEJ2O.corrige){html=window.TEJ2O.carteDevoirFait()}else{const cor=window.TEJ2O?.corrige;html=`<div class="card">${cor?window.TEJ2O_BANDEAU_CORRIGE(oldVersion?{score:cor.score}:cor):''}${oldVersion?'<div class="oldv"><b>Ce devoir a été modifié après ton envoi.</b> Ton score reste celui de l’ancienne version. Voici les nouvelles questions avec leurs bonnes réponses.</div>':''}<h2>Devoir 1 — Les bases de la cybersécurité</h2>${cor?'':`<p>10 questions · 1 point chacune. Lis bien chaque situation : plusieurs réponses peuvent sembler correctes, une seule est la meilleure. Clique ensuite sur <b>Envoyer le devoir</b>. Le corrigé sera disponible dans ton compte quand ton enseignant(e) le publiera.</p>`}${questions.map((q,i)=>`<div class="mini" style="margin:12px 0"><b>Question ${i+1}</b><p>${esc(q[0])}</p><div class="choices">${order[i].map((j,pos)=>`<button class="choice ${quizAnswers[i]===j?'selected':''}" onclick="quizChoose(${i},${j})" ${submitted?'disabled':''}>${String.fromCharCode(65+pos)}. ${esc(q[1][j])}</button>`).join('')}</div>${corrected?`<div class="feedback ${quizAnswers[i]===q[2]||quizAnswers[i]===undefined?'good':'no'}"><b>${quizAnswers[i]===undefined?'Bonne réponse : '+esc(q[1][q[2]]):quizAnswers[i]===q[2]?'✓ Bonne réponse':'✗ Réponse attendue : '+esc(q[1][q[2]])}</b><p>${esc(q[3])}</p></div>`:''}</div>`).join('')}<div class="nav"><span>${Object.keys(quizAnswers).length} / 10 réponses</span>${cor?'<a href="../index.html?compte" style="display:inline-block;padding:10px 16px;border-radius:10px;background:#e8c77c;color:#08231b;font-weight:800;text-decoration:none">Retour à mon compte</a>':submitted?'':`<button onclick="submitQuiz()" ${Object.keys(quizAnswers).length!==10?'disabled':''}>Envoyer le devoir</button>`}</div>${corrected&&Object.keys(quizAnswers).length===10?`<div class="callout"><div class="score">${nbBonnes()}/10</div><b>Résultat : ${nbBonnes()*10} %</b>${cor?'':'<p>Ton résultat est enregistré dans ton compte et transmis à ton enseignant(e).</p>'}</div>`:''}</div>`;}
document.getElementById('content').innerHTML=html;document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===4;document.getElementById('next').textContent=step===3?'Passer au devoir →':'Suivant →';document.getElementById('navHint').textContent=step===4?'10 questions':`${step+1} / 4 activités`;}
function choose(i,j){answers[i]=j;render()}function quizChoose(i,j){if(submitted)return;quizAnswers[i]=j;render()}
async function submitQuiz(){
 if(Object.keys(quizAnswers).length!==10||submitted)return;
 if(!window.TEJ2O?.saveScore){alert('Connecte-toi avec ton compte élève pour envoyer le devoir.');return}
 // Version 2 answers are saved as {v:2,r:[...]} so that old submissions are never compared with the new questions.
 const saved=await window.TEJ2O.saveScore("homework1",nbBonnes()*10,{v:2,r:questions.map((q,i)=>quizAnswers[i]??null)});
 if(!saved){alert("Le devoir n'a pas été envoyé. Vérifie le message d'erreur puis réessaie.");return}
 render();window.scrollTo({top:0,behavior:"smooth"});
}
// Answer key: new answers are shown against the questions; an old (version 1) submission only shows the correct answers.
function openCorrige(c){const r=c.reponses;if(r&&r.v===2&&Array.isArray(r.r)){r.r.forEach((v,i)=>{if(v!=null)quizAnswers[i]=v})}else if(Array.isArray(r)){oldVersion=true}submitted=true;corrected=true;step=4;render();window.scrollTo(0,0)}
async function go(i){
 if(i===4){
  if(!window.TEJ2O){
   try{await window.tej2oAccessReady}catch(e){console.error('Erreur de chargement de access.js',e);alert('Erreur JavaScript dans le contrôle d’accès : '+e.message);return}
   if(!window.TEJ2O){alert(window.TEJ2O_ACCESS_ERROR||'Session non reconnue. Retourne à la page de connexion, connecte-toi, puis rouvre la leçon.');return}
  }
  if(!window.TEJ2O.teacher){
   const ctx=window.TEJ2O;
   const {data,error}=await ctx.db.from('tej2o_releases').select('activity_id').eq('class_id',ctx.classId).eq('activity_id','homework1');
   if(error){alert("Impossible de vérifier la publication du devoir : "+error.message);return}
   ctx.homeworkOpen=!!data?.length;
   if(!ctx.homeworkOpen){alert("Le devoir n'est pas accessible à ce compte. Vérifie que tu es inscrit dans la bonne classe.");return}
  }
 }
